<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <base href="/" />
  <title>CMS Login | The NewTown Classes</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0} body{font-family:'DM Sans',sans-serif;min-height:100vh;background:linear-gradient(135deg,#eef6ff,#f8fafc);color:#172033;display:flex;flex-direction:column}
    .nav{height:64px;background:#003087;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;color:#fff;text-decoration:none}.logo span{color:#0ea5e9}.nav a:last-child{color:#dbeafe;text-decoration:none;font-weight:700;font-size:.88rem}
    .wrap{flex:1;display:grid;place-items:center;padding:2rem 1rem}.card{width:min(430px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(0,48,135,.1);border-radius:24px;padding:2rem;box-shadow:0 28px 80px -48px rgba(0,48,135,.65)}
    .mark{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#003087,#0ea5e9);display:grid;place-items:center;color:#fff;font-family:'Syne';font-size:1.6rem;font-weight:800;margin:0 auto 1rem}
    h1{font-family:'Syne',sans-serif;color:#003087;text-align:center;font-size:1.55rem;margin-bottom:.35rem}p{text-align:center;color:#64748b;font-size:.9rem;margin-bottom:1.4rem}
    form{display:grid;gap:1rem}.field{display:grid;gap:.35rem}.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:800}.field input{padding:.85rem 1rem;border:1px solid rgba(0,48,135,.14);border-radius:12px;font:inherit;background:#fff}.field input:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
    button{border:0;border-radius:14px;background:linear-gradient(135deg,#003087,#0ea5e9);color:#fff;font:inherit;font-weight:800;padding:.9rem;cursor:pointer;box-shadow:0 12px 30px -18px rgba(0,48,135,.8)}button:disabled{opacity:.65;cursor:not-allowed}.msg{display:none;padding:.75rem .9rem;border-radius:10px;font-size:.85rem}.msg.show{display:block}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.hint{margin-top:1rem;color:#64748b;font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <nav class="nav"><a class="logo" href="/">The NewTown <span>Classes</span></a><a href="/login/admin">Admin Login</a></nav>
  <main class="wrap">
    <section class="card">
      <div class="mark">CMS</div>
      <h1>Owner CMS Login</h1>
      <p>Admissions, accounts, enquiries, batches, planner, and complete money records.</p>
      <form id="cmsLoginForm">
        <div class="field"><label>Email</label><input id="cmsEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="cmsPassword" type="password" autocomplete="current-password" required></div>
        <div id="cmsMsg" class="msg err"></div>
        <button id="cmsLoginBtn" type="submit">Open CMS</button>
      </form>
      <div class="hint">Access is allowed only for admins marked <strong>isOwner: true</strong>.</div>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { FIREBASE_CONFIG, initAppCheck } from "/firebase-config.js";
    const app=initializeApp(FIREBASE_CONFIG); await initAppCheck(app); const auth=getAuth(app); const db=getFirestore(app);
    const $=id=>document.getElementById(id);
    $('cmsLoginForm').addEventListener('submit',async e=>{
      e.preventDefault(); $('cmsMsg').className='msg err'; $('cmsMsg').textContent=''; const btn=$('cmsLoginBtn'); btn.disabled=true; btn.textContent='Checking...';
      try{
        const cred=await signInWithEmailAndPassword(auth,$('cmsEmail').value.trim(),$('cmsPassword').value);
        const snap=await getDoc(doc(db,'admins',cred.user.uid));
        if(!snap.exists() || snap.data().isOwner!==true){ await auth.signOut(); throw new Error('CMS access denied. Set isOwner: true for this admin.'); }
        location.href='/cms-panel.html';
      }catch(err){ $('cmsMsg').textContent=err.message||'Login failed'; $('cmsMsg').classList.add('show'); }
      finally{ btn.disabled=false; btn.textContent='Open CMS'; }
    });
  </script>
</body>
</html>
