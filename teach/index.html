<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teach Portal | The NewTown Classes</title>
</head>
<body>
  <script>
    fetch('/teacher-dashboard.html')
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load teach portal.');
        return res.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.textContent = 'Teach portal is unavailable. Please refresh.';
      });
  </script>
</body>
</html>
