<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot Preview – The NewTown Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0a0f2e;
      --deep: #050918;
      --gold: #f5c842;
      --gold2: #e8a020;
      --sky: #38b6ff;
      --teal: #2aabb3;
      --white: #f8f9ff;
      --muted: #8892b0;
      --card-glass: rgba(14,21,53,0.6);
      --border: rgba(245,200,66,0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--deep);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .preview-label {
      position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
      background: rgba(245,200,66,.1); border: 1px solid rgba(245,200,66,.3);
      padding: .5rem 1.5rem; border-radius: 50px;
      font-size: .85rem; color: var(--gold); font-weight: 600;
      letter-spacing: 1px; z-index: 999;
    }

    /* ── CHATBOT WIDGET ── */
    .chatbot-toggle {
      position: fixed; bottom: 2rem; right: 2rem;
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(245,200,66,.35);
      transition: transform .25s, box-shadow .25s;
      z-index: 1000;
    }
    .chatbot-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 32px rgba(245,200,66,.5);
    }
    .chatbot-toggle svg { width: 28px; height: 28px; fill: var(--navy); }
    .chatbot-toggle .close-icon { display: none; }
    .chatbot-toggle.active .chat-icon { display: none; }
    .chatbot-toggle.active .close-icon { display: block; }

    .chatbot-window {
      position: fixed; bottom: 6.5rem; right: 2rem;
      width: 380px; max-height: 520px;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(245,200,66,.08);
      z-index: 1000;
      animation: chatSlideUp .3s ease;
    }
    .chatbot-window.open { display: flex; }

    @keyframes chatSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .chatbot-header {
      background: linear-gradient(135deg, rgba(245,200,66,.12), rgba(42,171,179,.08));
      padding: 1.1rem 1.4rem;
      display: flex; align-items: center; gap: .8rem;
      border-bottom: 1px solid var(--border);
    }
    .chatbot-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .chatbot-header-text h4 {
      font-family: 'Syne', sans-serif;
      font-size: .95rem; font-weight: 700;
      color: var(--white);
    }
    .chatbot-header-text span {
      font-size: .72rem; color: var(--teal);
      display: flex; align-items: center; gap: .3rem;
    }
    .chatbot-header-text span::before {
      content: ''; width: 6px; height: 6px;
      background: var(--teal); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

    /* Messages area */
    .chatbot-messages {
      flex: 1; overflow-y: auto; padding: 1.2rem;
      display: flex; flex-direction: column; gap: .8rem;
      min-height: 300px; max-height: 340px;
      scrollbar-width: thin;
      scrollbar-color: rgba(245,200,66,.2) transparent;
    }

    .chat-msg {
      max-width: 85%; padding: .7rem 1rem;
      border-radius: 16px; font-size: .88rem;
      line-height: 1.5; animation: msgFade .3s ease;
    }
    @keyframes msgFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-msg.bot {
      background: var(--card-glass);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      backdrop-filter: blur(8px);
    }
    .chat-msg.user {
      background: linear-gradient(135deg, rgba(245,200,66,.15), rgba(245,200,66,.08));
      border: 1px solid rgba(245,200,66,.25);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      color: var(--gold);
      font-weight: 500;
    }

    /* Options */
    .chat-options {
      display: flex; flex-direction: column; gap: .5rem;
      align-self: flex-start; max-width: 85%;
      animation: msgFade .3s ease;
    }
    .chat-option-btn {
      background: rgba(5,9,24,.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .6rem 1rem;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem; font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all .25s ease;
      display: flex; align-items: center; gap: .5rem;
    }
    .chat-option-btn::before {
      content: ''; width: 8px; height: 8px;
      border: 1.5px solid var(--gold);
      border-radius: 50%; flex-shrink: 0;
      transition: all .2s;
    }
    .chat-option-btn:hover {
      background: rgba(245,200,66,.08);
      border-color: rgba(245,200,66,.4);
      transform: translateX(4px);
    }
    .chat-option-btn:hover::before {
      background: var(--gold);
    }
    .chat-option-btn.selected {
      background: rgba(245,200,66,.12);
      border-color: var(--gold);
      color: var(--gold);
    }
    .chat-option-btn.selected::before {
      background: var(--gold);
    }
    .chat-option-btn:disabled {
      opacity: .4; pointer-events: none;
    }

    /* Input area */
    .chatbot-input {
      padding: .8rem 1rem;
      border-top: 1px solid var(--border);
      display: flex; gap: .6rem; align-items: center;
      background: rgba(5,9,24,.5);
    }
    .chatbot-input input {
      flex: 1; background: rgba(14,21,53,.8);
      border: 1px solid var(--border);
      border-radius: 10px; padding: .6rem .9rem;
      color: var(--white); font-family: inherit;
      font-size: .85rem; outline: none;
      transition: border-color .2s;
    }
    .chatbot-input input:focus {
      border-color: rgba(245,200,66,.4);
    }
    .chatbot-input input::placeholder { color: var(--muted); }
    .chatbot-input button {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s, box-shadow .2s;
      flex-shrink: 0;
    }
    .chatbot-input button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(245,200,66,.3);
    }
    .chatbot-input button svg { width: 16px; height: 16px; fill: var(--navy); }

    .chatbot-input.hidden { display: none; }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 4px; padding: .7rem 1rem;
      background: var(--card-glass); border: 1px solid var(--border);
      border-radius: 16px; border-bottom-left-radius: 4px;
      align-self: flex-start; backdrop-filter: blur(8px);
    }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); opacity:.4; }
      30% { transform: translateY(-6px); opacity:1; }
    }

    /* Summary card */
    .summary-card {
      background: linear-gradient(135deg, rgba(245,200,66,.08), rgba(42,171,179,.05));
      border: 1px solid rgba(245,200,66,.25);
      border-radius: 14px; padding: 1rem;
      align-self: flex-start; max-width: 90%;
      animation: msgFade .3s ease;
    }
    .summary-card h5 {
      font-family: 'Syne', sans-serif;
      font-size: .85rem; font-weight: 700;
      color: var(--gold); margin-bottom: .6rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: .8rem; padding: .25rem 0;
      border-bottom: 1px solid rgba(245,200,66,.08);
    }
    .summary-row:last-child { border: none; }
    .summary-label { color: var(--muted); }
    .summary-value { color: var(--white); font-weight: 500; }

    /* Mobile */
    @media (max-width: 480px) {
      .chatbot-window {
        right: 0; left: 0; bottom: 0;
        width: 100%; max-height: 85vh;
        border-radius: 20px 20px 0 0;
      }
      .chatbot-toggle { bottom: 1.2rem; right: 1.2rem; width: 54px; height: 54px; }
    }
  </style>
</head>
<body>

  <div class="preview-label">CHATBOT PREVIEW — Click the gold button to open</div>

  <!-- Toggle button -->
  <button class="chatbot-toggle" id="chatToggle" onclick="toggleChat()">
    <svg class="chat-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/><path d="M7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/></svg>
    <svg class="close-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <!-- Chat window -->
  <div class="chatbot-window" id="chatWindow">
    <div class="chatbot-header">
      <div class="chatbot-avatar">🎓</div>
      <div class="chatbot-header-text">
        <h4>NewTown Classes</h4>
        <span>Online now</span>
      </div>
    </div>

    <div class="chatbot-messages" id="chatMessages"></div>

    <div class="chatbot-input hidden" id="chatInput">
      <input type="text" id="userInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')sendInput()"/>
      <button onclick="sendInput()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

<script>
const flow = [
  {
    id: 'welcome',
    bot: "Hi there! 👋 Welcome to The NewTown Classes. I'd love to help you get started. What are you looking for?",
    options: [
      { label: '📚 Admission Enquiry', next: 'student_name' },
      { label: '📞 Talk to a Counselor', next: 'counselor' },
      { label: 'ℹ️ Just Browsing', next: 'browsing' }
    ]
  },
  {
    id: 'student_name',
    bot: "Great! Let's get you started. What is the student's name?",
    input: true,
    field: 'name',
    next: 'class_select'
  },
  {
    id: 'class_select',
    bot: "Nice to meet you, {name}! Which class is the student currently in?",
    options: [
      { label: 'Class 7', next: 'course_select' },
      { label: 'Class 8', next: 'course_select' },
      { label: 'Class 9', next: 'course_select' },
      { label: 'Class 10', next: 'course_select' },
      { label: 'Class 11', next: 'course_select' },
      { label: 'Class 12', next: 'course_select' }
    ],
    field: 'class'
  },
  {
    id: 'course_select',
    bot: "What course are you interested in?",
    options: [
      { label: '🩺 NEET Preparation', next: 'mode_select' },
      { label: '⚙️ JEE Preparation', next: 'mode_select' },
      { label: '📖 Board Exam Coaching', next: 'mode_select' },
      { label: '🔬 Science & Math Foundation', next: 'mode_select' }
    ],
    field: 'course'
  },
  {
    id: 'mode_select',
    bot: "How would you prefer to learn?",
    options: [
      { label: '🏫 Offline (In-Center)', next: 'phone' },
      { label: '💻 Online Classes', next: 'phone' },
      { label: '👤 One-to-One', next: 'phone' },
      { label: '🤔 Not Sure Yet', next: 'phone' }
    ],
    field: 'mode'
  },
  {
    id: 'phone',
    bot: "Almost done! Please share a phone number so our team can reach out to you.",
    input: true,
    field: 'phone',
    next: 'summary'
  },
  {
    id: 'summary',
    bot: 'summary',
    next: 'end'
  },
  {
    id: 'counselor',
    bot: "You can reach our counselors at 📞 +91 99034 61361 or visit us at our Newtown, Kolkata center. Would you also like to fill in your details so we can call you back?",
    options: [
      { label: '✅ Yes, take my details', next: 'student_name' },
      { label: '❌ No thanks', next: 'end_simple' }
    ]
  },
  {
    id: 'browsing',
    bot: "No problem! Feel free to explore. If you change your mind about admissions, just click the chat button anytime. Happy to help! 😊",
    next: null
  },
  {
    id: 'end_simple',
    bot: "No worries! Feel free to reach out anytime. Good luck with your studies! 🌟",
    next: null
  }
];

let data = {};
let currentStep = null;

function toggleChat() {
  const win = document.getElementById('chatWindow');
  const btn = document.getElementById('chatToggle');
  const isOpen = win.classList.contains('open');

  if (isOpen) {
    win.classList.remove('open');
    btn.classList.remove('active');
  } else {
    win.classList.add('open');
    btn.classList.add('active');
    if (!currentStep) {
      setTimeout(() => startFlow(), 400);
    }
  }
}

function startFlow() {
  showStep('welcome');
}

function showStep(stepId) {
  currentStep = stepId;
  const step = flow.find(s => s.id === stepId);
  if (!step) return;

  const msgs = document.getElementById('chatMessages');
  const inputArea = document.getElementById('chatInput');

  // Show typing indicator
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    typing.remove();

    if (step.bot === 'summary') {
      showSummary();
      return;
    }

    // Bot message
    let botText = step.bot;
    Object.keys(data).forEach(k => {
      botText = botText.replace(`{${k}}`, data[k]);
    });

    const msgEl = document.createElement('div');
    msgEl.className = 'chat-msg bot';
    msgEl.textContent = botText;
    msgs.appendChild(msgEl);

    // Options
    if (step.options) {
      inputArea.classList.add('hidden');
      const optWrap = document.createElement('div');
      optWrap.className = 'chat-options';

      step.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'chat-option-btn';
        btn.textContent = opt.label;
        btn.onclick = () => {
          // Mark selected
          optWrap.querySelectorAll('.chat-option-btn').forEach(b => {
            b.disabled = true;
            b.classList.remove('selected');
          });
          btn.classList.add('selected');

          // User reply
          const userMsg = document.createElement('div');
          userMsg.className = 'chat-msg user';
          userMsg.textContent = opt.label;
          msgs.appendChild(userMsg);

          if (step.field) {
            data[step.field] = opt.label.replace(/^[^\w]*/, '').trim();
          }

          msgs.scrollTop = msgs.scrollHeight;
          setTimeout(() => showStep(opt.next), 600);
        };
        optWrap.appendChild(btn);
      });

      msgs.appendChild(optWrap);
    }

    // Text input
    if (step.input) {
      inputArea.classList.remove('hidden');
      const inp = document.getElementById('userInput');
      inp.value = '';
      inp.placeholder = step.field === 'phone' ? 'Enter phone number...' : 'Type your answer...';
      setTimeout(() => inp.focus(), 100);

      window._currentInputHandler = () => {
        const val = inp.value.trim();
        if (!val) return;

        data[step.field] = val;
        inputArea.classList.add('hidden');

        const userMsg = document.createElement('div');
        userMsg.className = 'chat-msg user';
        userMsg.textContent = val;
        msgs.appendChild(userMsg);

        inp.value = '';
        msgs.scrollTop = msgs.scrollHeight;
        setTimeout(() => showStep(step.next), 600);
      };
    }

    msgs.scrollTop = msgs.scrollHeight;
  }, 800);
}

function sendInput() {
  if (window._currentInputHandler) {
    window._currentInputHandler();
  }
}

function showSummary() {
  const msgs = document.getElementById('chatMessages');

  const thankMsg = document.createElement('div');
  thankMsg.className = 'chat-msg bot';
  thankMsg.textContent = "Thank you! Here's a summary of your details:";
  msgs.appendChild(thankMsg);

  setTimeout(() => {
    const card = document.createElement('div');
    card.className = 'summary-card';
    card.innerHTML = `
      <h5>📋 Enquiry Summary</h5>
      <div class="summary-row"><span class="summary-label">Name</span><span class="summary-value">${data.name || '-'}</span></div>
      <div class="summary-row"><span class="summary-label">Class</span><span class="summary-value">${data.class || '-'}</span></div>
      <div class="summary-row"><span class="summary-label">Course</span><span class="summary-value">${data.course || '-'}</span></div>
      <div class="summary-row"><span class="summary-label">Mode</span><span class="summary-value">${data.mode || '-'}</span></div>
      <div class="summary-row"><span class="summary-label">Phone</span><span class="summary-value">${data.phone || '-'}</span></div>
    `;
    msgs.appendChild(card);

    setTimeout(() => {
      const endMsg = document.createElement('div');
      endMsg.className = 'chat-msg bot';
      endMsg.textContent = "Our team will reach out to you within 24 hours. We're excited to have you join The NewTown Classes! 🌟";
      msgs.appendChild(endMsg);
      msgs.scrollTop = msgs.scrollHeight;
    }, 600);

    msgs.scrollTop = msgs.scrollHeight;
  }, 500);
}

// Auto-open on load for preview
setTimeout(() => {
  toggleChat();
}, 500);
</script>

</body>
</html>
