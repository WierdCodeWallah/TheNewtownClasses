# ════════════════════════════════════════════════════
#  THE NEWTOWN CLASSES — Netlify Configuration
# ════════════════════════════════════════════════════

[build]
  publish = "."
  # Stamps /assets/js and /assets/css references with content hashes (see Caching).
  command = "node scripts/version-assets.cjs"

# Serve portal HTML directly: avoid fetching a second HTML page and document.write
# through the directory shims. force overrides the existing directory index files.
[[redirects]]
  from = "/learn"
  to = "/student-dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/teach"
  to = "/teacher-dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/command-center"
  to = "/admin-panel.html"
  status = 200
  force = true

[[redirects]]
  from = "/login/student"
  to = "/student-login.html"
  status = 200
  force = true

[[redirects]]
  from = "/login/teacher"
  to = "/teacher-login.html"
  status = 200
  force = true

[[redirects]]
  from = "/login/admin"
  to = "/admin-login.html"
  status = 200
  force = true

# Serve Firebase's sign-in helper pages from our own domain, so Google's
# account chooser says "thenewtownclasses.com" instead of
# "the-newtown-classes-d98e8.firebaseapp.com". Pairs with authDomain in
# assets/js/firebase-config.js and the redirect URI
# https://thenewtownclasses.com/__/auth/handler on the Google OAuth client.
[[redirects]]
  from = "/__/auth/*"
  to = "https://the-newtown-classes-d98e8.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://the-newtown-classes-d98e8.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Clean public routes. Old .html URLs redirect to these names, and the clean
# names rewrite back to the existing static files behind the scenes.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/student-login.html"
  to = "/login/student"
  status = 301

[[redirects]]
  from = "/teacher-login.html"
  to = "/login/teacher"
  status = 301

[[redirects]]
  from = "/admin-login.html"
  to = "/login/admin"
  status = 301

[[redirects]]
  from = "/student-dashboard.html"
  to = "/learn"
  status = 301

[[redirects]]
  from = "/teacher-dashboard.html"
  to = "/teach"
  status = 301

[[redirects]]
  from = "/admin-panel.html"
  to = "/command-center"
  status = 301

[[redirects]]
  from = "/students-demo.html"
  to = "/students-preview"
  status = 301

# ── Tell Netlify the Firebase API key is intentionally public ──
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB-aTXaWLduMaB9lw6lxGcOWzhzKcH2B0E"

# ── Caching ──
# Scripts and styles are referenced as /assets/…?v=<content hash> (stamped by
# scripts/version-assets.cjs during the build), so they can be cached for a
# year: an edited file gets a new URL. Pages themselves are always revalidated.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and fonts don't carry a version, so let browsers reuse them for a day
# and refresh in the background after that.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
