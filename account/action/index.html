<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- The link carries a one-time code: send other sites only our origin, never the path or query.
       (Not no-referrer: the Firebase API key is restricted by referrer.) -->
  <meta name="referrer" content="strict-origin"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Account | The NewTown Classes</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#0b2d7b">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: radial-gradient(120% 70% at 50% 0%, #e0e9ff 0%, #f5f7ff 55%) #f5f7ff;
      color: #111827;
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 16px; max-width: 1100px; width: 100%; margin: 0 auto;
    }
    .brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: #0b2d7b;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; letter-spacing: -.3px; }
    .brand img { width: 34px; height: 34px; border-radius: 10px; }
    .home { color: #475569; text-decoration: none; font-size: .9rem; font-weight: 500; }
    .home:hover { color: #0b2d7b; }

    main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 1.2rem 16px 2.5rem; }
    .card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 22px;
      box-shadow: 0 24px 60px -24px rgba(11,45,123,.35), 0 2px 6px rgba(15,23,42,.05);
      overflow: hidden;
    }
    .hero {
      background: linear-gradient(135deg, #0b2d7b 0%, #1d4ed8 100%);
      color: #fff; padding: 1.6rem 1.5rem 1.4rem; position: relative; overflow: hidden;
    }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px;
      border-radius: 50%; border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 0 0 26px rgba(255,255,255,.04); }
    .kicker { font-size: .7rem; letter-spacing: 2.2px; font-weight: 700; opacity: .75; text-transform: uppercase; }
    .hero h1 { font-family: 'Syne', sans-serif; font-size: 1.55rem; line-height: 1.15; margin-top: .45rem; letter-spacing: -.5px; }
    .hero p { margin-top: .45rem; font-size: .92rem; opacity: .85; line-height: 1.45; word-break: break-word; }
    .body { padding: 1.4rem 1.5rem 1.6rem; }

    .field { border: 1.5px solid #dbe3f4; border-radius: 14px; padding: .55rem .85rem .6rem; background: #f8faff;
      transition: border-color .15s, box-shadow .15s; margin-bottom: .85rem; }
    .field:focus-within { border-color: #1d4ed8; box-shadow: 0 0 0 4px rgba(29,78,216,.12); background: #fff; }
    .field label { display: block; font-size: .78rem; font-weight: 700; color: #334155; margin-bottom: .2rem; }
    .row { display: flex; align-items: center; gap: .5rem; }
    .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1rem; color: #0f172a; padding: .25rem 0; }
    .toggle { border: 0; background: none; color: #1d4ed8; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; padding: .3rem .2rem; }

    .meter { height: 5px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin: -.3rem 0 .35rem; }
    .meter span { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .25s, background .25s; }
    .hint { font-size: .8rem; color: #64748b; margin-bottom: .9rem; min-height: 1.1em; }

    .msg { font-size: .88rem; line-height: 1.45; border-radius: 12px; padding: .7rem .85rem; margin-bottom: .9rem; display: none; }
    .msg.err { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    .btn { display: flex; align-items: center; justify-content: center; gap: .4rem; width: 100%;
      background: #0b2d7b; color: #fff; border: 0; border-radius: 14px; padding: .95rem 1rem;
      font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none;
      transition: transform .1s, background .15s; }
    .btn:hover { background: #1d4ed8; }
    .btn:active { transform: scale(.98); }
    .btn[disabled] { opacity: .65; cursor: wait; }
    .btn.ghost { background: #eef2ff; color: #0b2d7b; margin-top: .6rem; }

    .state { text-align: center; padding: .6rem 0 .2rem; }
    .badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 1rem; font-size: 1.8rem; }
    .badge.ok { background: #ecfdf5; color: #059669; }
    .badge.bad { background: #fef2f2; color: #dc2626; }
    .state h2 { font-family: 'Syne', sans-serif; font-size: 1.25rem; color: #0f172a; margin-bottom: .4rem; }
    .state p { color: #475569; font-size: .93rem; line-height: 1.5; margin-bottom: 1.2rem; }

    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #dbe3f4; border-top-color: #1d4ed8;
      margin: 1.2rem auto; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } .btn, .meter span { transition: none; } }

    footer { text-align: center; font-size: .78rem; color: #94a3b8; padding: 0 16px 1.2rem; }
    footer a { color: #64748b; text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img src="/assets/img/logo-mark.png" alt="" width="34" height="34"/>The NewTown Classes</a>
    <a class="home" href="/">Home</a>
  </header>

  <main>
    <div class="card">
      <div class="hero">
        <div class="kicker" id="kicker">Account</div>
        <h1 id="title">One moment…</h1>
        <p id="subtitle">Checking your link.</p>
      </div>
      <div class="body">
        <div id="loading"><div class="spinner" role="status" aria-label="Loading"></div></div>

        <form id="resetForm" hidden novalidate>
          <div class="field">
            <label for="newPw">New password</label>
            <div class="row">
              <input id="newPw" type="password" autocomplete="new-password" minlength="6" required enterkeyhint="next"/>
              <button type="button" class="toggle" data-for="newPw" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="meter" aria-hidden="true"><span id="meterBar"></span></div>
          <div class="hint" id="pwHint">At least 6 characters. Longer is stronger.</div>
          <div class="field">
            <label for="confirmPw">Confirm new password</label>
            <div class="row">
              <input id="confirmPw" type="password" autocomplete="new-password" minlength="6" required enterkeyhint="go"/>
              <button type="button" class="toggle" data-for="confirmPw" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="msg" id="formMsg" role="alert"></div>
          <button class="btn" id="saveBtn" type="submit">Save new password →</button>
        </form>

        <div id="result" class="state" hidden>
          <div class="badge" id="resultBadge"></div>
          <h2 id="resultTitle"></h2>
          <p id="resultText"></p>
          <a class="btn" id="resultBtn" href="/login/teacher">Sign in</a>
          <a class="btn ghost" id="resultAlt" href="/" hidden>Back to home</a>
        </div>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 <a href="/">The NewTown Classes</a></footer>

  <script type="module">
    // Firebase sends every account email (password reset, email verification,
    // email change) here once the template's action URL is set to
    // https://thenewtownclasses.com/account/action — so links show our domain.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset, checkActionCode, applyActionCode }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { FIREBASE_CONFIG, initAppCheck } from "/assets/js/firebase-config.js?v=4b98d617";

    const $ = id => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    // The code is moved out of the URL below; sessionStorage lets a refresh still work.
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem('ntcAction') || '{}'); } catch (_) {}
    const mode = qs.get('mode') || saved.mode, code = qs.get('oobCode') || saved.code;
    if (qs.get('continueUrl')) saved.next = qs.get('continueUrl');

    // Only follow a continue link back into our own site.
    let next = '/login/teacher';
    try {
      const c = new URL(qs.get('continueUrl') || saved.next || '', location.origin);
      if (c.origin === location.origin) next = c.pathname + c.search;
    } catch (_) {}

    // Keep the one-time code out of the address bar, history and screenshots.
    if (qs.get('oobCode')) {
      try { sessionStorage.setItem('ntcAction', JSON.stringify({ mode, code, next: saved.next })); } catch (_) {}
      history.replaceState(null, '', location.pathname);
    }
    const forget = () => { try { sessionStorage.removeItem('ntcAction'); } catch (_) {} };

    function hero(kicker, title, sub) { $('kicker').textContent = kicker; $('title').textContent = title; $('subtitle').textContent = sub; }
    function show(ok, title, text, btnText, href, alt) {
      $('loading').hidden = true; $('resetForm').hidden = true; $('result').hidden = false;
      $('resultBadge').className = 'badge ' + (ok ? 'ok' : 'bad');
      $('resultBadge').textContent = ok ? '✓' : '!';
      $('resultTitle').textContent = title; $('resultText').textContent = text;
      $('resultBtn').textContent = btnText; $('resultBtn').href = href;
      $('resultAlt').hidden = !alt;
      $('resultBtn').focus();
    }
    function linkProblem(err) {
      forget();
      const expired = err && err.code === 'auth/expired-action-code';
      hero('Account', expired ? 'This link has expired' : 'This link can’t be used',
        'Links are single-use and expire after a while.');
      show(false, expired ? 'Link expired' : 'Link already used or invalid',
        'Ask for a fresh link from the sign-in page using “Forgot password?”, or ask the admin to reset your password.',
        'Go to sign in', next, true);
    }

    const app = initializeApp(FIREBASE_CONFIG, 'ntc-account-action');
    await initAppCheck(app);
    const auth = getAuth(app);

    if (!mode || !code) {
      linkProblem(null);
    } else if (mode === 'resetPassword') {
      try {
        const email = await verifyPasswordResetCode(auth, code);
        hero('Password reset', 'Set a new password', 'for ' + email);
        $('loading').hidden = true; $('resetForm').hidden = false; $('newPw').focus();
      } catch (e) { linkProblem(e); }
    } else if (mode === 'verifyEmail' || mode === 'verifyAndChangeEmail') {
      try {
        await applyActionCode(auth, code); forget();
        hero('Email', 'You’re verified', 'Your email address is confirmed.');
        show(true, 'Email confirmed', 'Thanks! You can continue to The NewTown Classes.', 'Continue', next, false);
      } catch (e) { linkProblem(e); }
    } else if (mode === 'recoverEmail') {
      try {
        const info = await checkActionCode(auth, code);
        await applyActionCode(auth, code); forget();
        const restored = info.data.email || 'your previous email';
        hero('Email', 'Email restored', 'Sign-in email changed back to ' + restored + '.');
        show(true, 'Change undone', 'If you didn’t ask for the change, also reset your password to keep the account safe.',
          'Go to sign in', next, true);
      } catch (e) { linkProblem(e); }
    } else {
      linkProblem(null);
    }

    // ── Reset form ──
    document.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () => {
      const inp = $(b.dataset.for), showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      b.textContent = showing ? 'Show' : 'Hide';
      b.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }));

    $('newPw').addEventListener('input', () => {
      const v = $('newPw').value;
      let s = 0;
      if (v.length >= 6) s++; if (v.length >= 10) s++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
      const lvl = [['0%', '#e2e8f0', 'At least 6 characters. Longer is stronger.'], ['25%', '#ef4444', 'Weak'],
                   ['50%', '#f59e0b', 'Okay'], ['75%', '#10b981', 'Good'], ['100%', '#059669', 'Strong']][v ? Math.min(4, Math.max(1, s)) : 0];
      $('meterBar').style.width = lvl[0]; $('meterBar').style.background = lvl[1]; $('pwHint').textContent = lvl[2];
    });
    $('newPw').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('confirmPw').focus(); } });

    $('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = $('newPw').value, pw2 = $('confirmPw').value, msg = $('formMsg');
      msg.className = 'msg';
      if (pw.length < 6) { msg.textContent = 'Please use at least 6 characters.'; msg.className = 'msg err'; $('newPw').focus(); return; }
      if (pw !== pw2) { msg.textContent = 'The two passwords don’t match.'; msg.className = 'msg err'; $('confirmPw').focus(); return; }
      const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await confirmPasswordReset(auth, code, pw);
        forget();
        hero('Password reset', 'All set!', 'Your password has been changed.');
        show(true, 'Password updated', 'Use your new password the next time you sign in.', 'Sign in now →', next, false);
      } catch (err) {
        if (err.code === 'auth/weak-password') { msg.textContent = 'That password is too weak. Try a longer one.'; }
        else if (err.code === 'auth/network-request-failed') { msg.textContent = 'Network error. Check your internet and try again.'; }
        else if (/action-code/.test(err.code || '')) { linkProblem(err); return; }
        else { msg.textContent = 'Couldn’t save the password. Please try again.'; }
        msg.className = 'msg err';
        btn.disabled = false; btn.textContent = 'Save new password →';
      }
    });
  </script>
</body>
</html>
